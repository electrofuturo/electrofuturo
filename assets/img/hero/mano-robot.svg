<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320"><g transform="translate(640 0) scale(-1 1)">
<defs>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#E3EBF2"/><stop offset="1" stop-color="#A9B8C6"/>
  </linearGradient>
  <linearGradient id="oscuro" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4A5A6B"/><stop offset="1" stop-color="#1B2633"/>
  </linearGradient>
  <radialGradient id="luz"><stop offset="0" stop-color="#7FF3FF"/><stop offset=".45" stop-color="#19C1D6"/><stop offset="1" stop-color="#19C1D6" stop-opacity="0"/></radialGradient>
  <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".22" stop-color="#fff"/></linearGradient>
  <mask id="m"><rect width="640" height="320" fill="url(#fade)"/></mask>
</defs>
<g mask="url(#m)">
  <!-- antebrazo: núcleo oscuro + carcasa -->
  <path d="M0 160 L190 150 L196 230 L0 246 Z" fill="url(#oscuro)"/>
  <path d="M0 140 C60 138 120 134 170 130 L178 176 C120 180 60 184 0 186 Z" fill="url(#metal)"/>
  <path d="M0 212 C60 210 120 208 182 204 L190 244 C120 250 60 256 0 262 Z" fill="url(#metal)"/>
  <rect x="96" y="181" width="70" height="6" rx="3" fill="#19C1D6" opacity=".85"/>
  <!-- muñeca -->
  <circle cx="190" cy="190" r="26" fill="url(#oscuro)"/><circle cx="190" cy="190" r="9" fill="url(#luz)"/>
  <!-- dedos doblados -->
  <rect x="318" y="176" width="88" height="40" rx="18" fill="url(#metal)"/>
  <rect x="306" y="206" width="80" height="36" rx="17" fill="url(#metal)"/>
  <rect x="292" y="232" width="68" height="30" rx="14" fill="#C9D5E0"/>
  <circle cx="402" cy="196" r="7" fill="url(#oscuro)"/><circle cx="382" cy="224" r="6" fill="url(#oscuro)"/>
  <!-- palma -->
  <path d="M206 140 C250 128 300 122 340 126 C368 130 386 142 388 160 C390 178 370 188 344 192 C322 222 300 246 262 252 C240 256 222 250 212 238 Z" fill="url(#metal)"/>
  <path d="M232 160 C270 150 312 148 344 156" fill="none" stroke="#A9B8C6" stroke-width="2"/>
  <path d="M236 206 C262 214 290 212 318 200" fill="none" stroke="#A9B8C6" stroke-width="2"/>
  <circle cx="276" cy="184" r="12" fill="url(#oscuro)"/><circle cx="276" cy="184" r="6" fill="#19C1D6"/>
  <!-- índice: eje interno + tres falanges con articulaciones -->
  <rect x="330" y="150" width="300" height="18" rx="9" fill="url(#oscuro)"/>
  <rect x="340" y="134" width="118" height="44" rx="20" fill="url(#metal)"/>
  <circle cx="466" cy="158" r="13" fill="url(#oscuro)"/><circle cx="466" cy="158" r="5" fill="#19C1D6"/>
  <rect x="476" y="139" width="82" height="38" rx="18" fill="url(#metal)"/>
  <circle cx="565" cy="159" r="11" fill="url(#oscuro)"/><circle cx="565" cy="159" r="4" fill="#19C1D6"/>
  <path d="M574 143 L618 145 C634 146 640 152 640 160 C640 168 634 174 618 175 L574 176 Z" fill="url(#metal)"/>
  <!-- líneas de panel -->
  <g stroke="#93A4B4" stroke-width="1.5" fill="none" opacity=".8">
    <path d="M360 146 L440 146"/><path d="M494 149 L540 149"/><path d="M590 151 L620 151"/>
  </g>
  <!-- brillo -->
  <path d="M210 146 C280 132 350 134 450 140" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".8"/>
  <!-- halo cian en la punta -->
  <circle cx="634" cy="160" r="14" fill="url(#luz)" opacity=".9"/>
</g></g></svg>